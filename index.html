<title>Bing Bong</title>
<style>
/* Layout: one centered portrait court that JS sizes to fill the screen, overlays on top. Single-theme by design. */
@font-face { font-family: "Bungee"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/bungee-latin.woff2) format("woff2"); }
@font-face { font-family: "Nunito"; font-style: normal; font-weight: 200 1000; font-display: swap; src: url(fonts/nunito-latin.woff2) format("woff2"); }
:root {
  --grass: #3f9b3a;
  --grass-dark: #2e7a2c;
  --butter: #f4d33b;
  --butter-dark: #e2bd1c;
  --ink: #1f2a12;
  --cream: #fffbe6;
  --poop: #7a4a21;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--cream);
  font-family: var(--body);
  display: grid; place-items: center;
  box-sizing: border-box;
}
/* framed: a bordered court centered on wide screens (desktop, a tablet on its side) */
.court {
  position: relative;
  width: 360px; height: 480px; /* JS sets the real size */
  border: 4px solid var(--cream);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 0 0 4px var(--ink), 0 12px 30px rgb(0 0 0 / .5);
}
body:not(.full) { padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
/* full: on phones the court is the whole screen and runs under the status bar and home indicator */
body.full .court { border: 0; border-radius: 0; box-shadow: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
/* round buttons sitting on the center line: pause on the right, power-up drops (robot battles) on the left */
.hud {
  position: absolute; top: 50%; margin-top: -19px; width: 38px; height: 38px; padding: 0; border-radius: 50%;
  display: grid; place-items: center; background: rgb(255 251 230 / .9); box-shadow: 0 3px 0 var(--ink);
}
.hud:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.hud svg { width: 16px; height: 16px; fill: currentColor; }
#pause { right: max(8px, env(safe-area-inset-right)); }
#dropBtn { left: max(8px, env(safe-area-inset-left)); background: var(--pc, #fff); font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-size: 19px; line-height: 1; }
.drops {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(calc(100% - 32px), 420px); max-height: 75%; overflow-y: auto; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px;
  background: rgb(31 42 18 / .94); border: 3px solid var(--cream); border-radius: 16px; box-shadow: 0 12px 30px rgb(0 0 0 / .5);
}
.drops h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.1rem; color: var(--butter); text-transform: uppercase; }
.drops p { margin: 0; font-size: .8rem; font-weight: 600; text-align: center; }
.dgrid { --dot: 42px; width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--dot), 1fr)); gap: 10px 6px; justify-items: center; }
/* the score is painted on the court by the canvas; this copy is for screen readers */
.score { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  background: rgb(31 42 18 / .78);
  text-align: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
}
.overlay.home { background: rgb(31 42 18 / .25); }
.overlay.home h2 { font-size: clamp(2.6rem, 13vw, 4rem); }
.overlay.home p { background: rgb(31 42 18 / .8); border-radius: 8px; padding: 8px 12px; }
.picks { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.overlay:not(.home) .picks { display: none; }
.picks { gap: 12px 8px; max-width: 420px; }
.pick { background: none; border: 0; box-shadow: none; padding: 0; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--cream); }
.pick:active { transform: none; box-shadow: none; }
.pick .ic {
  width: 64px; height: 64px; border-radius: 50%; overflow: hidden;
  display: grid; place-items: center; background: var(--cream);
  border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-size: 32px; line-height: 1;
  transition: transform .12s;
}
.pick:hover .ic { transform: scale(1.08) rotate(-4deg); }
.pick:active .ic { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.pick:focus-visible { outline: none; }
.pick:focus-visible .ic { outline: 3px solid var(--cream); outline-offset: 3px; }
.pick .ic canvas { width: 100%; height: 100%; display: block; }
.pick .cap { font-size: .55rem; color: var(--butter); letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 1px 0 var(--ink); }
.pick .val { font-size: .62rem; line-height: 1.2; background: rgb(31 42 18 / .85); border-radius: 6px; padding: 2px 6px; text-align: center; }
.picker {
  position: absolute; inset: 0; overflow-y: auto;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: max(20px, calc(env(safe-area-inset-top) + 8px)) 16px 0; background: rgb(31 42 18 / .9);
}
.picker h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 6vw, 2.2rem); color: var(--butter); text-shadow: 3px 3px 0 var(--grass-dark); text-transform: uppercase; }
.pgrid { width: 100%; max-width: 540px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.opt {
  background: none; border: 0; box-shadow: none; padding: 10px 6px; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px;
  color: var(--cream); font-size: .68rem; line-height: 1.2; text-align: center;
}
.opt:active { transform: none; box-shadow: none; }
.opt canvas { display: block; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); transition: transform .12s; }
.opt canvas.ball { width: 76px; height: 76px; border-radius: 50%; background: var(--cream); }
.opt canvas.field { width: 69px; height: 92px; border-radius: 8px; }
.opt:hover canvas { transform: scale(1.08) rotate(-3deg); }
.opt[aria-pressed="true"] { background: rgb(244 211 59 / .18); outline: 3px solid var(--butter); }
.opt[aria-pressed="true"] span { color: var(--butter); }
#pickerBack { margin: auto 0 max(16px, env(safe-area-inset-bottom)); position: sticky; bottom: max(16px, env(safe-area-inset-bottom)); flex: none; }
.pgrid.settings { display: flex; flex-direction: column; gap: 12px; }
.pgrid.settings .opt { padding: 6px 2px; gap: 5px; font-size: .6rem; }
.sect h4 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--cream); }
.srow { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 4px; }
.srow.eight { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (min-width: 640px) { .srow.eight { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.opt .emo {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-size: 23px; line-height: 1;
  transition: transform .12s;
}
.opt:hover .emo { transform: scale(1.08) rotate(-4deg); }
.overlay.home #go { width: 92px; height: 92px; border-radius: 50%; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .75rem; }
.overlay.home #go::before { content: "▶"; font-size: 2rem; line-height: 1; }
.acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }
#quit { background: var(--cream); font-size: .8rem; padding: 8px 16px; }
.overlay h2 {
  font-family: var(--display); font-weight: 400; margin: 0;
  font-size: clamp(1.8rem, 9vw, 2.8rem); line-height: 1.05; color: var(--butter);
  text-wrap: balance; text-shadow: 3px 3px 0 var(--grass-dark);
}
.overlay p { margin: 0; font-weight: 600; max-width: 30ch; }
button {
  font-family: var(--display); font-size: 1rem; cursor: pointer;
  border: 3px solid var(--ink); border-radius: 8px; padding: 10px 22px;
  background: var(--butter); color: var(--ink);
  box-shadow: 0 4px 0 var(--ink);
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
.dot {
  width: var(--dot); height: var(--dot); padding: 0; border-radius: 50%;
  display: grid; place-items: center; background: var(--pc);
  border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  font-size: calc(var(--dot) * .5); line-height: 1;
  transition: transform .12s;
}
.dot:hover { transform: scale(1.08); }
.dot[aria-pressed="true"] { outline: 3px solid var(--cream); outline-offset: 2px; transform: scale(1.12); }
/* phone on its side: a compact home screen so Start stays on screen */
@media (max-height: 500px) {
  .overlay { gap: 10px; }
  .overlay.home h2 { font-size: 1.9rem; }
  .overlay.home p { display: none; }
  .pick { width: 72px; }
  .pick .ic { width: 50px; height: 50px; font-size: 26px; }
  .overlay.home #go { width: 66px; height: 66px; font-size: .6rem; }
  .overlay.home #go::before { font-size: 1.4rem; }
}
/* "Add to Home Screen" tip, home screen only, in Safari only */
.install {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: max(14px, calc(env(safe-area-inset-bottom) + 4px));
  width: max-content; max-width: calc(100% - 24px); box-sizing: border-box;
  display: flex; align-items: center; gap: 4px; padding: 6px 4px 6px 14px; border-radius: 999px;
  background: rgb(31 42 18 / .9); font-size: .8rem; font-weight: 600; text-align: center;
}
.install b { color: var(--butter); font-weight: 800; }
.install svg { width: 15px; height: 15px; vertical-align: -2px; fill: none; stroke: var(--butter); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#installX { background: none; border: 0; box-shadow: none; color: var(--cream); font-family: var(--body); font-size: 1rem; padding: 2px 10px; opacity: .7; }
/* phone app: no page scroll, bounce, zoom or text selection */
[hidden] { display: none !important; }
html { background: var(--ink); -webkit-text-size-adjust: 100%; }
html, body { overscroll-behavior: none; }
body {
  margin: 0; font-size: 14px; overflow: hidden; height: 100%; height: 100dvh;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
* { touch-action: manipulation; }
canvas { touch-action: none; }
.picker { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
.picker * { touch-action: pan-y; }
</style>

<body>
<div class="court">
  <canvas id="c" width="480" height="640" aria-label="Pong court"></canvas>
  <div class="score" aria-live="polite"><b id="lab1">P1</b> <span id="s1">0</span><br><b id="lab2">P2</b> <span id="s2">0</span></div>
  <button id="pause" class="hud" type="button" aria-label="Pause" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
  <button id="dropBtn" class="hud" type="button" aria-label="Pick a power-up to drop" aria-expanded="false" hidden>🎲</button>
  <div class="drops" id="drops" hidden>
    <h3>Drop a power-up</h3>
    <p>Pick one, then tap the court to drop it on the bots.</p>
    <div class="dgrid" id="dropGrid"></div>
  </div>
  <div class="overlay" id="overlay">
    <h2 id="msg">BING BONG</h2>
    <p id="sub">Player 1 (top): ← → arrows. Player 2 (bottom): A D. First to 5 wins.</p>
    <div class="picks">
      <button id="pickBall" class="pick" type="button"><span class="ic"><canvas id="icBall" width="96" height="96"></canvas></span><span class="cap">Ball</span><span class="val" id="ballName">Poop</span></button>
      <button id="pickField" class="pick" type="button"><span class="ic"><canvas id="icField" width="96" height="96"></canvas></span><span class="cap">Field</span><span class="val" id="fieldName">Classic</span></button>
      <button id="pickSettings" class="pick" type="button"><span class="ic"><span>⚙️</span></span><span class="cap">Settings</span><span class="val" id="setName">2 players</span></button>
    </div>
    <div class="acts">
      <button id="go" type="button">Start</button>
      <button id="quit" type="button" hidden>Menu</button>
    </div>
  </div>
  <div class="picker" id="picker" hidden>
    <h3 id="pickerTitle">Pick a ball</h3>
    <div class="pgrid" id="pickerGrid"></div>
    <button id="pickerBack" type="button">Back</button>
  </div>
  <div class="install" id="install" hidden>
    <span>Install: tap <b>Share</b> <svg viewBox="0 0 24 24" aria-label="Share icon"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M8 10H5v11h14V10h-3"/></svg> then <b>Add to Home Screen</b></span>
    <button id="installX" type="button" aria-label="Dismiss install tip">✕</button>
  </div>
</div>
<div id="safe" aria-hidden="true"></div>

<script>
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const $ = id => document.getElementById(id);
const cv = $('c');
let ctx = cv.getContext('2d');
const PW = 90, PH = 14, R = 14, WIN = 5, MAX_SPEED = 15, TURBO_MAX = 20, SPEED = 11;
// Court size in game units. 480x640 is the classic 3:4; on phones it takes the screen's shape (see layout).
// EDGE keeps the paddles clear of the status bar and home indicator, which the field runs underneath.
let W = 480, H = 640, EDGE = 0;
const els = { s1: $('s1'), s2: $('s2'), overlay: $('overlay'), msg: $('msg'), sub: $('sub'), go: $('go'), quit: $('quit') };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let p1, p2, balls = [], ball = null, score, state, lastServeDir = 1, countdownEnd = 0, pointTimer = 0, pendingWinner = -1;
const keys = {};
let powerOn = true;

// ---------- effects state ----------
let parts = [], rings = [], floaters = [], banners = [], pickups = [], holes = [];
let shake = 0, flash = 0, flashColor = '#ffffff', slowmo = 0, rally = 0, spawnTimer = 150, tick = 0, pulse = 0, pulseColor = '#ffd23f';
const scorePop = [0, 0];
const NEON = ['#ffd23f', '#ff4fa3', '#35e07a', '#59c8ff', '#ff6a1a', '#b07cff'];
const OWNER_COLOR = ['#59c8ff', '#ff4fa3'];

const POWERS = [
  { id: 'big',     name: 'MEGA PADDLE', icon: '↔', color: '#35e07a' },
  { id: 'tiny',    name: 'SHRINK RAY',  icon: '↘', color: '#ff4fa3' },
  { id: 'multi',   name: 'MULTIBALL',   icon: '✱', color: '#ffd23f' },
  { id: 'fast',    name: 'TURBO',       icon: '»', color: '#ff6a1a' },
  { id: 'slow',    name: 'SLOW-MO',     icon: '◔', color: '#59c8ff' },
  { id: 'freeze',  name: 'FREEZE',      icon: '✲', color: '#bff3ff' },
  { id: 'shield',  name: 'FORCE FIELD', icon: '▬', color: '#b07cff' },
  { id: 'giant',   name: 'GIANT BALL',  icon: '●', color: '#ff3b3b' },
  { id: 'reverse', name: 'REVERSO',     icon: '⇄', color: '#c6ff3a' },
  { id: 'ghost',   name: 'GHOST BALL',  icon: '?', color: '#e6e6ff' },
  { id: 'curve',   name: 'CURVEBALL',   icon: 'S', color: '#ff9df0' },
  { id: 'hole',    name: 'BLACK HOLE',  icon: '◉', color: '#9b5cff' },
  { id: 'magnet',  name: 'MAGNET',      icon: 'U', color: '#ff2e4d' },
  { id: 'bumpers', name: 'PINBALL',     icon: '◎', color: '#00e5c7' },

// touch: each finger steers the paddle on the half it first touched, so two players can't steal each other's paddle
const grabs = new Map();
const dragPaddle = e => {
  if (e.pointerType === 'mouse' && !e.buttons) return;

  const r = cv.getBoundingClientRect();
  let x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  let p = grabs.get(e.pointerId);

cv.addEventListener('pointermove', dragPaddle);

// ---------- effect helpers ----------
function addShake(n) { if (!reduceMotion) shake = Math.min(40, shake + n); }

function boom(x, y, n, colors, power = 8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30 + Math.random() * 40, max: 70, size: 2 + Math.random() * 4, color: colors[i % colors.length], spark: Math.random() < .4 });

}
function floatText(x, y, text, color, size = 20) { floaters.push({ x, y, text, color, size, life: 60 }); }

function spawnPickup() {
  const pw = POWERS[Math.floor(Math.random() * POWERS.length)];
  pickups.push({ ...pw, x: 50 + Math.random() * (W - 100), y: H * .28 + Math.random() * H * .44, life: 720, born: tick });
  rings.push({ x: pickups.at(-1).x, y: pickups.at(-1).y, r: 4, max: 60, w: 4, color: pw.color });
}
function applyPower(pw, b) {
  const me = b.owner === 0 ? p1 : p2, opp = b.owner === 0 ? p2 : p1;
  const who = shortName(b.owner);
  switch (pw.id) {
    case 'big': me.big = 600; break;
    case 'tiny': opp.tiny = 480; break;
    case 'multi':
      for (let i = 0; i < 2 && balls.length < 7; i++) {
        const nb = newBall(b.vy > 0 ? 1 : -1, b.x, b.y, (Math.random() * 2 - 1) * .9, Math.max(5, Math.hypot(b.vx, b.vy)));
        nb.owner = b.owner; balls.push(nb);
      }
      break;
    case 'fast': for (const o of balls) { o.vx *= 1.4; o.vy *= 1.4; } break;
    case 'slow': slowmo = 300; break;
    case 'freeze': opp.frozen = 150; break;
    case 'shield': me.shield = 900; break;
    case 'giant': for (const o of balls) o.giant = 480; break;
    case 'reverse': opp.reversed = 360; break;
    case 'ghost': for (const o of balls) o.ghost = 300; break;
    case 'curve': for (const o of balls) o.curve = 420; break;
    case 'magnet': me.magnet = 540; break;
    case 'bumpers':
      bumpers = [];
      for (let i = 0; i < 3; i++) bumpers.push({ x: 90 + i * (W - 180) / 2, y: H / 2 + (i === 1 ? -70 : 70), r: 24, life: 540, hit: 0 });
      break;
    case 'teleport':
      for (const o of balls) {
        boom(o.x, o.y, 25, ['#7df9ff', '#ffffff'], 6);
        rings.push({ x: o.x, y: o.y, r: 30, max: 2, w: 6, color: '#7df9ff' });
        o.x = 40 + Math.random() * (W - 80); o.trail = [];
        rings.push({ x: o.x, y: o.y, r: 2, max: 80, w: 6, color: '#7df9ff' });
      }
      break;
    case 'quake': quake = 240; break;
    case 'disco': disco = 420; break;
    case 'double': me.double = true; break;
    case 'boots': me.boots = 600; break;
    case 'drunk': opp.drunk = 360; break;
    case 'blackout': blackout = 300; break;
    case 'mini': for (const o of balls) { o.mini = 480; o.giant = 0; } break;
    case 'hole': holes.push({ x: W * .25 + Math.random() * W * .5, y: H * .38 + Math.random() * H * .24, life: 360, spin: 0 }); break;

  rings.push({ x: b.x, y: b.y, r: 6, max: 260, w: 10, color: pw.color });
  banners.push({ text: pw.name, sub: `${who} GRABBED IT`, color: pw.color, life: 0, dur: 80 });
  addFlash(pw.color, .45); addShake(12);

}

function movePaddle(p, left, right) {
  if (p.frozen > 0) return;
  const sp = SPEED * (p.boots > 0 ? 1.8 : 1);
  let dx = (right ? sp : 0) - (left ? sp : 0);
  if (p.reversed > 0) dx = -dx;

}
function updatePaddle(p) {

}

function step() {

    if (pickups.length < 4) spawnPickup();
  }

  pickups = pickups.filter(pk => pk.life > 0);

  for (const bm of bumpers) { bm.life--; bm.hit *= .9; }
  bumpers = bumpers.filter(bm => bm.life > 0);
  if (quake > 0) { quake--; addShake(1.6); }

  for (const b of balls) {

}

const FIELD_STYLE = {
  classic: { line: '#fffbe6', p1: '#fffbe6', p2: '#2e7a2c', l1: 'rgba(255,251,230,.6)', l2: 'rgba(31,42,18,.45)' },
  usa:     { line: '#1d2f6f', p1: '#f4c21b', p2: '#f4c21b', l1: 'rgba(29,47,111,.6)', l2: 'rgba(29,47,111,.6)' },
  italy:   { line: '#1f2a12', p1: '#1d2f6f', p2: '#1d2f6f', l1: 'rgba(31,42,18,.45)', l2: 'rgba(31,42,18,.45)' },
  purplegold:   { line: '#d4a53a', p1: '#d4a53a', p2: '#d4a53a', l1: 'rgba(212,165,58,.7)', l2: 'rgba(212,165,58,.7)' },
  burgundygold: { line: '#fffbe6', p1: '#fffbe6', p2: '#1f1a14', l1: 'rgba(255,251,230,.6)', l2: 'rgba(90,20,20,.55)' },

  football:   { own: true, p1: '#f4c21b', p2: '#f4c21b', l1: 'rgba(255,255,255,.65)', l2: 'rgba(255,255,255,.65)' },
  basketball: { own: true, p1: '#1d2f6f', p2: '#1d2f6f', l1: 'rgba(60,35,15,.5)', l2: 'rgba(60,35,15,.5)' },
  pool:       { own: true, p1: '#f2e6c9', p2: '#f2e6c9', l1: 'rgba(255,255,255,.4)', l2: 'rgba(255,255,255,.4)' },
  pingpong:   { own: true, p1: '#d22d2d', p2: '#d22d2d', l1: 'rgba(255,255,255,.55)', l2: 'rgba(255,255,255,.55)' },
  redblue: { line: '#fffbe6', p1: '#fffbe6', p2: '#fffbe6', l1: 'rgba(255,251,230,.6)', l2: 'rgba(255,251,230,.6)' },
};
function drawField() {
  const f = FIELDS[fieldIdx][0], st = FIELD_STYLE[f];
  if (f === 'classic' || f === 'redblue') {
    const stripes = 8, sh = H / stripes;
    const c = f === 'classic' ? ['#4aa944', '#3f9b3a', '#f7dc55', '#f4d33b'] : ['#dc4242', '#cf3434', '#3a69d8', '#2f5fd0'];
    for (let i = 0; i < stripes; i++) {
      const top = i < stripes / 2;
      ctx.fillStyle = top ? c[i % 2] : c[2 + i % 2];
      ctx.fillRect(0, i * sh, W, sh);
    }
  } else if (f === 'usa') {
    const sh = H / 13;
    for (let i = 0; i < 13; i++) { ctx.fillStyle = i % 2 ? '#ffffff' : '#c8243a'; ctx.fillRect(0, i * sh, W, sh + 1); }
    const cw = W * 0.46, ch = sh * 7;
    ctx.fillStyle = '#1d2f6f'; ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#ffffff';
    for (let r = 0; r < 9; r++) {
      const n = r % 2 ? 5 : 6, gx = cw / 6;
      for (let k = 0; k < n; k++) star(gx * (k + (r % 2 ? 1 : .5)), ch / 10 * (r + 1), 5);
    }
  } else if (f === 'purplegold' || f === 'burgundygold') {
    const stripes = 8, sh = H / stripes;
    const c = f === 'purplegold' ? ['#3d2a85', '#33226f', '#1d1d1f', '#121214'] : ['#6d1a1f', '#5a1418', '#f2bd2f', '#e6b01f'];
    for (let i = 0; i < stripes; i++) { ctx.fillStyle = i < stripes / 2 ? c[i % 2] : c[2 + i % 2]; ctx.fillRect(0, i * sh, W, sh); }
    // gold side trim
    ctx.fillStyle = f === 'purplegold' ? '#d4a53a' : '#f2bd2f';
    ctx.fillRect(0, 0, 6, H); ctx.fillRect(W - 6, 0, 6, H);
  } else if (f === 'baseball') drawBaseballField();
  else if (f === 'football') drawFootballField();
  else if (f === 'basketball') drawBasketballCourt();
  else if (f === 'pool') drawPoolTable();
  else if (f === 'pingpong') drawPingPongTable();
  else if (f === 'italy') {
    const c = ['#009246', '#f4f5f0', '#ce2b37'];
    for (let i = 0; i < 3; i++) { ctx.fillStyle = c[i]; ctx.fillRect(i * W / 3, 0, W / 3 + 1, H); }
  }

    ctx.strokeStyle = st.line; ctx.lineWidth = 4; ctx.setLineDash([16, 12]);
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke(); ctx.setLineDash([]);

  ctx.fillStyle = st.l1; ctx.fillText(botBattle() ? 'BOT 1' : vsRobot() ? 'CPU' : 'PLAYER 1', 12, H / 2 - 30);
  ctx.fillStyle = st.l2; ctx.fillText(botBattle() ? 'BOT 2' : vsRobot() ? 'YOU' : 'PLAYER 2', 12, H / 2 + 44);
}
// the field only changes with the settings, so draw it once at screen resolution and reuse it every frame
const fieldCache = document.createElement('canvas');
let fieldKey = '';
function drawFieldCached() {
  const key = `${fieldIdx}|${modeIdx}|${cv.width}x${cv.height}|${EDGE}|${fontsReady}`;
  if (key !== fieldKey) {
    fieldKey = key;
    fieldCache.width = cv.width; fieldCache.height = cv.height;
    const main = ctx, keepH = H, sy = cv.height / H, c = fieldCache.getContext('2d');
    // the field itself lies between the two safe edges...
    try { ctx = c; H -= 2 * EDGE; ctx.setTransform(cv.width / W, 0, 0, sy, 0, EDGE * sy); drawField(); }
    finally { ctx = main; H = keepH; }
    // ...and its outermost rows are stretched to fill the strips under the status bar and home indicator
    const e = Math.round(EDGE * sy);
    if (e > 0) {
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.drawImage(fieldCache, 0, e + 2, cv.width, 1, 0, 0, cv.width, e + 2);
      c.drawImage(fieldCache, 0, cv.height - e - 3, cv.width, 1, 0, cv.height - e - 2, cv.width, e + 2);
    }
  }
  ctx.drawImage(fieldCache, 0, 0, W, H);
}
function drawScore() {
  // big score digits on the right, mirroring the player labels on the left
  const st = FIELD_STYLE[FIELDS[fieldIdx][0]];
  ctx.save(); ctx.font = '40px Bungee, Impact, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const i of [0, 1]) {
    ctx.save(); ctx.translate(W - 16, i ? H / 2 + 46 : H / 2 - 46); ctx.scale(1 + scorePop[i] * .7, 1 + scorePop[i] * .7);

}
function drawBaseballField() {
  // checkerboard mowed grass
  const n = 8, sz = W / n;
  for (let r = 0; r * sz < H; r++) for (let c = 0; c < n; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#3b8f3a' : '#45a043'; ctx.fillRect(c * sz, r * sz, sz + 1, sz + 1);
  }
  // warning tracks top and bottom

  const cx = W / 2, cy = H / 2 + 20, d = 150; // diamond half-diagonal

  ctx.beginPath(); ctx.moveTo(cx, cy - d - 26); ctx.lineTo(cx + d + 26, cy); ctx.lineTo(cx, cy + d + 26); ctx.lineTo(cx - d - 26, cy); ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#45a043';

  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, cy + d); ctx.lineTo(-20, cy + d - (cx + 20)); ctx.moveTo(cx, cy + d); ctx.lineTo(W + 20, cy + d - (cx + 20)); ctx.stroke();

  ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy - d); ctx.lineTo(cx + d, cy); ctx.lineTo(cx, cy + d); ctx.lineTo(cx - d, cy); ctx.closePath(); ctx.stroke();
  // mound
  ctx.fillStyle = '#c48d55'; ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 7, cy - 2, 14, 4);
  // bases
  for (const [bx, by] of [[cx + d, cy], [cx, cy - d], [cx - d, cy]]) {
    ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.PI / 4); ctx.fillRect(-7, -7, 14, 14); ctx.restore();

function drawStatus(p, top) {

// The game always advances in fixed 60-per-second steps, whatever the screen does:

const STEP_MS = 1000 / 60;

function render() {

      ctx.restore();
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .18;

        ctx.beginPath(); ctx.moveTo(W / 2, -20); ctx.lineTo(W / 2 + Math.cos(a) * 900 - 60, H + 40); ctx.lineTo(W / 2 + Math.cos(a) * 900 + 60, H + 40); ctx.fill();
      }
      ctx.restore();

      ctx.fillStyle = '#d8d8e8'; ctx.beginPath(); ctx.arc(W / 2, EDGE + 18, 16, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffffff'; for (let i = 0; i < 6; i++) ctx.fillRect(W / 2 - 12 + ((i * 7 + tick) % 24), EDGE + 10 + (i % 3) * 6, 3, 3);

const rain = Array.from({ length: 28 }, () => {

// ---------- sound: a tiny synth, so there are no audio files to download ----------
let soundOn = true, actx = null, out = null, noiseBuf = null;

// ---------- keep the screen on during a game (robot battles get no touches) ----------
let wakeLock = null; // a promise of the lock while one is held or being requested
function keepAwake(on) {

    const p = wakeLock = navigator.wakeLock.request('screen');
    p.then(l => l.addEventListener('release', () => { if (wakeLock === p) wakeLock = null; }), () => { if (wakeLock === p) wakeLock = null; });

    const p = wakeLock; wakeLock = null;
    p.then(l => l.release()).catch(() => {});
